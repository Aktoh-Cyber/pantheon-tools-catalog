[package]
name = "ioc-match"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: match observed indicators (hashes/domains/IPs) against an IOC list (Tier 0, pure compute)."

[[bin]]
name = "ioc-match"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

# Isolated from the catalog's Python/cargo tree; build via
# cd tools/ioc-match && cargo build --release --target wasm32-wasip2
[workspace]
