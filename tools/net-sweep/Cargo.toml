[package]
name = "net-sweep"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: TCP-connect liveness sweep across a host list (Tier 4, net:direct). The sandbox-legal ping — no ICMP."

[[bin]]
name = "net-sweep"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

# Isolated from the catalog's Python/cargo tree; build via
# cd tools/net-sweep && cargo build --release --target wasm32-wasip2
[workspace]
