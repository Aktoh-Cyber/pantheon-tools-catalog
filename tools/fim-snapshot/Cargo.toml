[package]
name = "fim-snapshot"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: file-integrity baseline — sha256/size/mtime per file + whole-tree fingerprint (Tier 5)."

[[bin]]
name = "fim-snapshot"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
