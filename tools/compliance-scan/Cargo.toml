[package]
name = "compliance-scan"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: evaluate a compliance policy bundle (os + packages + services + files) → pass/fail with evidence (Tier 2 flagship; read-only host APIs)."

[[bin]]
name = "compliance-scan"
path = "src/main.rs"

[dependencies]
serde_json = "1"
wit-bindgen = "0.41"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
