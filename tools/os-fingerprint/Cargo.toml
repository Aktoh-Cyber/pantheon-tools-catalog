[package]
name = "os-fingerprint"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: host OS fingerprint via the M11 inventory provider (Tier 1, host.inventory.os-info)."

[[bin]]
name = "os-fingerprint"
path = "src/main.rs"

[dependencies]
serde_json = "1"
wit-bindgen = "0.41"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
