# service-remediate capability declaration.
# Consumed by .github/workflows/{wasm-publish,manifest-backfill}.yml to build the
# ToolManifest sidecar's declared_capabilities (synapse #185/#190). Schema matches
# synapse-proto/src/manifest/tool_toml.rs. Caps cross-checked against tools/service-remediate/src
# (+ wit/ host imports where present); the tool source is the source of truth.
[tool]
name = "service-remediate"
version = "0.1.3"
language = "rust"

[tool.capabilities]
network_mode = "none"
mounts = []
host_apis = ["service.status", "service.restart", "service.stop", "service.enable", "service.disable"]  # mutating (host writes; CP remediation grant also required)
