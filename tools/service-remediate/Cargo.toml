[package]
name = "service-remediate"
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: ensure a service is running/enabled/disabled — idempotent, dry-run by default, verify-after-write (Tier 3 WRITE, host.service.*)."

[[bin]]
name = "service-remediate"
path = "src/main.rs"

[dependencies]
serde_json = "1"
wit-bindgen = "0.41"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
