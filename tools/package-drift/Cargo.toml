[package]
name = "package-drift"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: diff installed packages vs a golden manifest (Tier 2, pure compute)."

[[bin]]
name = "package-drift"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
