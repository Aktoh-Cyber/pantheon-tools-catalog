[package]
name = "fs-list"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: list directory contents on a node. First WASM reference tool per SYNAPSE-51."

[[bin]]
name = "fs-list"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

# Outside the workspace so the catalog repo's Python ecosystem doesn't
# accidentally pick this up as a cargo workspace member. Build via
# `cd tools/fs-list && cargo build --release --target wasm32-wasip2`.
[workspace]
