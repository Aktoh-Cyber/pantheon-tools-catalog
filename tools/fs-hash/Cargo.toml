[package]
name = "fs-hash"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: checksum files (sha256/sha1/md5) for integrity/FIM (Tier 0)."

[[bin]]
name = "fs-hash"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
