[package]
name = "fs-find"
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: find files by name-glob/size/mtime under a root (Tier 0)."

[[bin]]
name = "fs-find"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
