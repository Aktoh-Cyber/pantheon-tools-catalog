[package]
name = "secret-scan"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synapse v2 tool: scan a tree for leaked credentials — built-in regex rules + Shannon-entropy heuristic, secrets masked in output (Tier 5)."

[[bin]]
name = "secret-scan"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex-lite = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
