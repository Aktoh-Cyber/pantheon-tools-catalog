name: release

# On merge to main, cut a tag based on `pyproject.toml::project.version`.
# Manual tags (e.g. operator dry-runs) skip the auto-cut.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for tag detection

      - name: Read version from pyproject.toml
        id: ver
        run: |
          v=$(python3 -c "import tomllib,sys; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Skip if tag exists or version is 0.0.0
        id: skip
        run: |
          # Skip 0.0.0 — it's the project bootstrap default, not a
          # real release. Operator bumps to 0.1.0 (or whatever) in a
          # PR; the merge of that PR is the cut signal.
          if [ "${{ steps.ver.outputs.version }}" = "0.0.0" ]; then
            echo "Skipping tag-cut: pyproject version is 0.0.0 (bootstrap default)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Skipping tag-cut: ${{ steps.ver.outputs.tag }} already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag + push
        if: steps.skip.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
