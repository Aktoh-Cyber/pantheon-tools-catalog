name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check tools tests

      - name: mypy
        run: mypy tools

      - name: bandit
        run: bandit -q -r tools

      - name: pytest (unit, no testcontainers)
        run: pytest tests/ -m "not integration" -q

  integration:
    # Testcontainers needs Docker; runs on every PR but kept separate
    # from the fast unit lane so a Docker hiccup doesn't block PR review.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest (integration, testcontainers Neo4j)
        run: pytest tests/ -m "integration" -q
