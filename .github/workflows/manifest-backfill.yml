# Manifests-over-proxy backfill (2026-09-01, synapse #157).
#
# No catalog tool had ever shipped the tool-manifest sidecar synapse
# admission reads for tier/language — wasm-publish pushed only the WASM
# layer, so every admission (proxy AND direct-OCI path) logged
# `tier=unknown`. wasm-publish now attaches the sidecar on publish; this
# one-shot workflow backfills every ALREADY-published tool WITHOUT
# rebuilding anything (a rebuild could change the WASM digest and churn
# `catalog_release`).
#
# For each published tool (version resolved from ghcr's own tag list):
#   1. resolve the OCI manifest digest of ghcr…/<tool>:<version>
#   2. skip if `sha256-<hex>.manifest` already exists (unless `force`)
#   3. push the tool's REAL ToolManifest as the sidecar, with
#      declared_capabilities built from its checked-in tools/<tool>/tool.toml
#      (2026-09-21, synapse #185/#190, issue #37 — the sidecars this workflow
#      first shipped were capability-less stubs; run with `force: true` to
#      REPLACE those stubs in place, no rebuild, no WASM digest churn).
name: manifest-backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be pushed without pushing"
        type: boolean
        default: false
      force:
        description: "Overwrite sidecars that already exist (needed to replace pre-#37 stubs)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags

      - name: Install oras
        run: |
          set -euo pipefail
          curl -sLO https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar -xzf oras_1.2.0_linux_amd64.tar.gz oras
          sudo mv oras /usr/local/bin/oras

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Backfill manifest sidecars
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          PREFIX="ghcr.io/aktoh-cyber/pantheon-tools-catalog"
          pushed=0 skipped=0 missing=0
          # Latest published version per tool, from ghcr's OWN tag list —
          # git tags are unreliable (most tools were published via
          # workflow_dispatch, which creates no git tag; the 2026-09-01
          # dry run found tags for only 2 of 24 tools). Version tags are
          # bare semver; sidecar tags (sha256-*.manifest/.sig) filtered out.
          for tool_dir in tools/*/; do
            TOOL=$(basename "$tool_dir")
            [ "$TOOL" = "_shared" ] && continue
            VERSION=$(oras repo tags "$PREFIX/$TOOL" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$VERSION" ]; then
              echo "::warning::$TOOL: no version tag on ghcr — skipping"
              missing=$((missing+1)); continue
            fi
            REF="$PREFIX/$TOOL:$VERSION"
            if ! OCI_DIGEST=$(oras resolve "$REF" 2>/dev/null); then
              echo "::warning::$TOOL@$VERSION: resolve failed ($REF) — skipping"
              missing=$((missing+1)); continue
            fi
            HEX="${OCI_DIGEST#sha256:}"
            SIDECAR="$PREFIX/$TOOL:sha256-${HEX}.manifest"
            if [ "$FORCE" != "true" ] && oras resolve "$SIDECAR" >/dev/null 2>&1; then
              echo "$TOOL@$VERSION: sidecar already present — skipping (run with force:true to replace a pre-#37 stub)"
              skipped=$((skipped+1)); continue
            fi
            # declared_capabilities (2026-09-21, synapse #185/#190, issue #37):
            # backfill a REAL manifest (with the tool's declared_capabilities)
            # from its checked-in tool.toml, NOT the old stub. This is the
            # digest-safe path for already-published tools — it reads the live
            # OCI digest and never rebuilds, so no WASM digest churns. A tool with
            # a ghcr version but no tool.toml can't be given caps: warn + skip.
            if [ ! -f "tools/$TOOL/tool.toml" ]; then
              echo "::warning::$TOOL@$VERSION: no tools/$TOOL/tool.toml — cannot backfill declared_capabilities, skipping"
              missing=$((missing+1)); continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN: would push $SIDECAR (declared_capabilities from tools/$TOOL/tool.toml)"
              pushed=$((pushed+1)); continue
            fi
            # python3 is preinstalled on ubuntu-latest (>= 3.11 for tomllib). The
            # converter validates host_apis + fails loud on a malformed tool.toml.
            python3 tools/_shared/tool_manifest.py \
              --tool-toml "tools/$TOOL/tool.toml" \
              --expect-name "$TOOL" \
              --metadata "$(printf '{"backfilled_by":"manifest-backfill run %s"}' "${{ github.run_id }}")" \
              > tool-manifest.json
            oras push "$SIDECAR" \
              tool-manifest.json:application/vnd.aktoh.synapse.tool-manifest.v1+json >/dev/null
            echo "$TOOL@$VERSION: sidecar (with declared_capabilities) pushed ($SIDECAR)"
            pushed=$((pushed+1))
          done
          echo "## Backfill: pushed=$pushed skipped=$skipped missing=$missing" | tee -a "$GITHUB_STEP_SUMMARY"
